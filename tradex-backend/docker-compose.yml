version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tradex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../tradex-ml/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tradex
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db

volumes:
  postgres_data:
