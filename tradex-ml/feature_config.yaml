# TradeX Feature Engineering Configuration
# All parameters for technical indicators, labels, and normalization

# Technical Indicator Periods
sma_periods: [10, 20, 50]
ema_periods: [12, 26]
rsi_period: 14

macd:
  fast: 12
  slow: 26
  signal: 9

bollinger:
  period: 20
  std_dev: 2.0

atr_period: 14

stochastic:
  k_period: 14
  d_period: 3

adx_period: 14

# Lag Features
lag_periods: [1, 3, 5]

# Label Generation
label_horizon: 5
label_threshold: 0.001

# Risk-Adjusted Labels
risk_label_horizon: 20
risk_min_sharpe: 0.5

# Normalization: zscore | minmax
normalization: zscore

# Train/Val/Test Split Ratios
train_ratio: 0.7
val_ratio: 0.15
# test_ratio = 1 - train_ratio - val_ratio = 0.15
